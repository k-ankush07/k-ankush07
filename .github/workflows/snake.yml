name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # har 12 ghante me update
  workflow_dispatch:          # manually run karne ke liye
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Trim top gap in SVG
        run: |
          python3 - <<'EOF'
          import re
          for f in ["dist/github-snake.svg", "dist/github-snake-dark.svg"]:
              s = open(f).read()
              tag = re.search(r'<svg[^>]*>', s).group(0)
              x, y, w, h = map(float, re.search(r'viewBox="([^"]+)"', tag).group(1).split())
              nh = h + y  # y negative hai, isliye height kam hogi
              new = re.sub(r'viewBox="[^"]+"', f'viewBox="{x:g} 0 {w:g} {nh:g}"', tag)
              new = re.sub(r'(?<![\w-])height="[^"]+"', f'height="{nh:g}"', new)
              open(f, "w").write(s.replace(tag, new, 1))
          EOF

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
