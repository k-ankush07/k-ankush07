<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Dashboard</title>

    <style>
      .banner-img {
        border: 1px solid;
        border-image-source: linear-gradient(
          90deg,
          #8f74bf 0%,
          #d76d77 32.21%,
          #ffaf7b 100%
        );
        border-image-slice: 1;
        border-radius: 10px;
        overflow: hidden;
      }

      .banner-img img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <div class="github-dashboard">
      <div class="banner-img">
        <img
          src="https://ankush.bio/assets1/main-github.png"
          alt="GitHub Dashboard"
        />
      </div>
    </div>
  </body>
</html>
